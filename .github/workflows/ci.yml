name: CI

permissions:
  contents: read

on:
  push:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    name: Code standards & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4

      - name: "📦 Install pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: "11.3.0"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: "📦 Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "🔎 Lint code"
        run: pnpm run lint

      - name: Verify publishing, language, theme and video behavior
        run: pnpm test

      - name: "📝 Checking code format"
        run: pnpm run format:check

      - name: "🚀 Build the project"
        run: pnpm run build

      - name: Save static site by source revision
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: dist/
          retention-days: 14
          if-no-files-found: error
